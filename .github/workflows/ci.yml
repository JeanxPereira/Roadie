name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BLENDER_VERSION: "5.2.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile (brutal/ must stay stdlib-only Python 3.11)
        run: |
          python -m compileall -q brutal blender tools tests check.py
          python -c "import brutal.dfpf, brutal.mesh, brutal.rig, brutal.texture, brutal.material, brutal.textobj, brutal.anim, brutal.shaders, brutal.rsalight, brutal.gfx"

      - name: Build extension
        run: python tools/build_addon.py

      - name: Cache Blender
        id: blender
        uses: actions/cache@v6
        with:
          path: .blender-bin
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          v="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${v}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar -xJ
          mv "blender-${BLENDER_VERSION}-linux-x64" .blender-bin

      - name: Blender runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libegl1

      - name: Validate and enable the extension
        run: sh tools/ci_blender.sh .blender-bin/blender dist/brutal_legend-*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip
